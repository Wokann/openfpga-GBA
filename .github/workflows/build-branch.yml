name: Build

on:
  push:
    branches: ['**']
    # Only run the (expensive) Quartus build when relevant sources change.
    # Documentation-only commits skip CI entirely.
    paths:
      - 'src/fpga/**'
      - 'pkg/**'
      - 'sim/**'
      - '.github/workflows/**'
      - 'generate.tcl'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run HAN RTL tests (Icarus Verilog)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          cd sim/han
          iverilog -g2012 -o tb_cart.vvp ../../src/fpga/han/gba_cart_controller.sv ../../src/fpga/han/rom_source_mux.sv tb_gba_cart_controller.sv
          vvp tb_cart.vvp
          iverilog -g2012 -o tb_mux.vvp ../../src/fpga/han/gba_cart_controller.sv ../../src/fpga/han/rom_source_mux.sv tb_rom_source_mux.sv
          vvp tb_mux.vvp

      # Restore the previous Quartus database so Smart Recompile can skip
      # unchanged stages (IP generation, unchanged fitter work). A full
      # build takes ~23 min on the free runner; small RTL changes should be
      # meaningfully faster with the cache. Key changes when RTL changes;
      # restore-keys always pulls the most recent database for incrementality.
      - name: Cache Quartus incremental database
        uses: actions/cache@v4
        with:
          path: |
            src/fpga/build/db
            src/fpga/build/incremental_db
          key: quartus-db-${{ hashFiles('src/fpga/**', 'generate.tcl', 'scripts/sta_custom_report.tcl') }}
          restore-keys: |
            quartus-db-

      - name: Compile
        run: docker run --rm -v ${{ github.workspace }}:/build -w /build raetro/quartus:21.1 quartus_sh -t generate.tcl

      - name: Reverse bitstream
        run: python3 scripts/reverse_bitstream.py src/fpga/build/output_files/ap_core.rbf pkg/Cores/mincer_ray.GBA/bitstream.rbf_r

      - name: Package build zip
        run: |
          VERSION=$(jq -r '.core.metadata.version' pkg/Cores/mincer_ray.GBA/core.json)
          BRANCH_NAME="${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"
          SAFE_BRANCH=$(printf '%s' "$BRANCH_NAME" | sed 's#[^A-Za-z0-9._-]#-#g')
          PACKAGE_ZIP="mincer_ray.GBA_${SAFE_BRANCH}_${VERSION}.zip"
          cd pkg
          zip -r "../${PACKAGE_ZIP}" .
          echo "PACKAGE_BRANCH=${SAFE_BRANCH}" >> "$GITHUB_ENV"
          echo "PACKAGE_ZIP=${PACKAGE_ZIP}" >> "$GITHUB_ENV"

      - name: Upload package zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ env.PACKAGE_BRANCH }}
          path: ${{ env.PACKAGE_ZIP }}

      - name: Extract timing closure failures
        if: always()
        run: |
          STA="src/fpga/build/output_files/ap_core.sta.summary"
          if [ -f "$STA" ]; then
            awk '
              /^Type/  { type_line = $0 }
              /^Slack/ { slack_line = $0; sub(/^Slack *: */, "", slack_line); slack = slack_line + 0 }
              /^TNS/   {
                tns_line = $0; sub(/^TNS *: */, "", tns_line); tns = tns_line + 0
                if (slack < 0) {
                  print type_line
                  print "Slack: " slack_line
                  print "TNS:   " tns_line
                  print ""
                }
                type_line = ""; slack = 0
              }
            ' "$STA" > timing.txt
          fi
          if [ ! -s timing.txt ]; then
            echo "No timing closure failures." > timing.txt
          fi

      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing
          path: timing.txt

      - name: Check custom STA reports
        if: always()
        run: |
          echo "=== Custom STA reports ==="
          ls -la build_output/reports/ 2>/dev/null || echo "No custom STA reports directory found"
          echo "=== Output files ==="
          ls -la src/fpga/build/output_files/*.rpt src/fpga/build/output_files/*.summary 2>/dev/null || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            src/fpga/build/output_files/ap_core.fit.summary
            src/fpga/build/output_files/ap_core.fit.rpt
            src/fpga/build/output_files/ap_core.sta.summary
            src/fpga/build/output_files/ap_core.sta.rpt
            src/fpga/build/output_files/ap_core.flow.rpt
            build_output/reports/
